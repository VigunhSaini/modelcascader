[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelcascader"
version = "0.1.0"
description = "Three-tier LLM cascade router using chained RouteLLM Controllers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "routellm>=0.2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.25",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modelcascader*", "eval*"]
